name: kaigishi_shiken
publish_to: "none"
description: 海技士試験 学習アプリ（Flutter Web）
version: 0.3.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  collection: ^1.18.0
  google_fonts: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    # 問題データ（フォールバック含む）
    - assets/questions/questions_v2.json
    - assets/questions/questions_ja.json
    - assets/questions/questions_en.json

    # 画像フォルダまるごと
    - assets/images/

    # トピック設定（順序）＋ 表示ラベルの多言語化
    - assets/config/topics.json
    - assets/config/topics.i18n.json

